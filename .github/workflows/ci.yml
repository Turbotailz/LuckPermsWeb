name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vue-tsc and eslint already fail on existing source, so they are not a gate.
      - run: pnpm test
      - name: Build (Cloudflare Pages preset)
        run: pnpm build
        env:
          CF_PAGES: "1"
          CF_PAGES_BRANCH: ${{ github.ref_name }}
          CF_PAGES_URL: https://luckperms.pages.dev
          NODE_OPTIONS: --max-old-space-size=4096
