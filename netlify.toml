[build]
  command = "git clone --depth 1 --branch v3-structure https://github.com/Turbotailz/wiki.git /tmp/luckperms-wiki && WIKI_PATH=/tmp/luckperms-wiki pnpm generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"
  WIKI_BRANCH = "v3-structure"

# Old GitHub wiki casing. Kept out of Nuxt routeRules (Vue Router is case-insensitive).
[[redirects]]
  from = "/wiki/FAQ"
  to = "/wiki/faq"
  status = 301

[[redirects]]
  from = "/wiki/Configuration"
  to = "/wiki/configuration"
  status = 301

# SPA fallback only for the three tool prefixes. Wiki misses stay 404.
[[redirects]]
  from = "/editor/*"
  to = "/editor/index.html"
  status = 200

[[redirects]]
  from = "/verbose/*"
  to = "/verbose/index.html"
  status = 200

[[redirects]]
  from = "/treeview/*"
  to = "/treeview/index.html"
  status = 200
